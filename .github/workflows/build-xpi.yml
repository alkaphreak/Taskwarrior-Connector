name: Build signed .xpi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set version for this build
        run: |
          # AMO rejects re-signing a version it has already seen ("Version X
          # already exists"), so manifest.json's committed version can only
          # ever be signed once. On a real release (v* tag), use the tag as
          # the canonical version. On any other trigger (workflow_dispatch
          # test runs), suffix the manifest's base version with the run
          # number so repeated manual runs each get a unique, valid version
          # without touching the source file.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE_VERSION=$(jq -r .version firefox/manifest.json)
            VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          jq --arg v "$VERSION" '.version = $v' firefox/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json firefox/manifest.json
          echo "Signing as version $VERSION"

      - name: Lint extension
        run: npx web-ext@10 lint --source-dir=firefox

      - name: Sign extension (AMO, unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx web-ext@10 sign \
            --source-dir=firefox \
            --artifacts-dir=web-ext-artifacts \
            --channel=unlisted \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET"

      - name: Locate signed .xpi
        id: xpi
        run: |
          xpi_path=$(find web-ext-artifacts -maxdepth 1 -name '*.xpi' | head -n 1)
          if [ -z "$xpi_path" ]; then
            echo "No .xpi produced — signing likely failed or is still pending review." >&2
            exit 1
          fi
          echo "path=$xpi_path" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v6
        with:
          name: taskwarrior-connector-xpi
          path: ${{ steps.xpi.outputs.path }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.xpi.outputs.path }}

      - name: Publish updates.json (self-hosted auto-update)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Firefox polls manifest.json's gecko.update_url for this file. It
          # must point at a real download link for the version it advertises,
          # so this only runs for actual tag releases — never for
          # workflow_dispatch test builds (their run-number-suffixed
          # versions, e.g. 0.3.7, aren't real releases and have no matching
          # Release asset to link to).
          VERSION="${GITHUB_REF#refs/tags/v}"
          XPI_PATH="${{ steps.xpi.outputs.path }}"
          XPI_NAME=$(basename "$XPI_PATH")
          SHA256=$(sha256sum "$XPI_PATH" | cut -d' ' -f1)
          ADDON_ID=$(jq -r '.browser_specific_settings.gecko.id' firefox/manifest.json)
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${XPI_NAME}"

          jq -n \
            --arg id "$ADDON_ID" \
            --arg version "$VERSION" \
            --arg link "$DOWNLOAD_URL" \
            --arg hash "sha256:${SHA256}" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash, applications: {gecko: {strict_min_version: "42.0"}}}]}}}' \
            > /tmp/updates.json

          git fetch origin main
          git checkout -B publish-updates-json origin/main
          cp /tmp/updates.json updates.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --cached --quiet; then
            echo "updates.json already up to date"
          else
            git commit -m "Publish updates.json for v${VERSION}"
            git push origin HEAD:main
          fi
