name: Build signed .xpi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint extension
        run: npx web-ext@10 lint --source-dir=firefox

      - name: Sign extension (AMO, unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx web-ext@10 sign \
            --source-dir=firefox \
            --artifacts-dir=web-ext-artifacts \
            --channel=unlisted \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET"

      - name: Locate signed .xpi
        id: xpi
        run: |
          xpi_path=$(find web-ext-artifacts -maxdepth 1 -name '*.xpi' | head -n 1)
          if [ -z "$xpi_path" ]; then
            echo "No .xpi produced — signing likely failed or is still pending review." >&2
            exit 1
          fi
          echo "path=$xpi_path" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: taskwarrior-connector-xpi
          path: ${{ steps.xpi.outputs.path }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.xpi.outputs.path }}
