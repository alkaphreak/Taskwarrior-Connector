name: Build signed .xpi

on:
  # Called by dist's release.yml after it published the GitHub Release (post-announce-jobs in
  # dist-workspace.toml): signs the .xpi and attaches it to that release.
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  # Manual test build: signed with a run-number suffix on AMO's unlisted channel (never
  # published or auto-updated), kept as a workflow artifact.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.plan && fromJson(inputs.plan).announcement_tag || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
          fetch-depth: 0 # release notes need the previous tag

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set version for this build
        run: |
          # AMO rejects re-signing a version it has already seen ("Version X
          # already exists"), so manifest.json's committed version can only
          # ever be signed once. On a real release (called by dist), use the
          # release tag as the canonical version. On a manual test run, suffix the manifest's base version with the run
          # number so repeated manual runs each get a unique, valid version
          # without touching the source file.
          if [[ -n "$RELEASE_TAG" ]]; then
            VERSION="${RELEASE_TAG#v}"
          else
            BASE_VERSION=$(jq -r .version firefox/manifest.json)
            VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          jq --arg v "$VERSION" '.version = $v' firefox/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json firefox/manifest.json
          echo "Signing as version $VERSION"

      - name: Release notes from feat/fix commits
        if: env.RELEASE_TAG != ''
        run: |
          # AMO shows these in about:addons > Release notes. web-ext sends the metadata's
          # "version" object with every new version, so release_notes rides along with the license.
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          if [[ -z "$PREV" && $(git tag | wc -l) -gt 1 ]]; then
            echo "No previous tag found before $RELEASE_TAG although tags exist" >&2; exit 1
          fi
          NOTES=$(git log --format=%s "${PREV:+$PREV..}$RELEASE_TAG" \
            | sed -nE 's/^(feat|fix)(\([^)]*\))?!?: //p' | sed -E 's/( \([^)]*\))+$//; s/^/- /')
          [[ -n "$NOTES" ]] || NOTES="- Maintenance release."
          # AMO caps release_notes at 3000 characters: keep whole bullets only.
          NOTES=$(printf '%s\n' "$NOTES" | awk -v tag="$RELEASE_TAG" '{ t += length($0) + 1
            if (t > 2800) { print "- More changes: see the " tag " GitHub release."; exit } print }')
          jq --arg n "$NOTES" '.version.release_notes = {"en-US": $n}' .github/amo-metadata.json > /tmp/amo-metadata.json
          mv /tmp/amo-metadata.json .github/amo-metadata.json
          printf 'Release notes:\n%s\n' "$NOTES"

      - name: Lint extension
        run: npx web-ext@10 lint --source-dir=firefox

      - name: Sign extension (AMO, listed for a release, unlisted for a manual run)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          # A manual run must not reach the listed channel: 0.4.0.N sorts above 0.4.0, so a
          # listed test build would auto-update every user to it.
          if [[ -n "$RELEASE_TAG" ]]; then CHANNEL=listed; else CHANNEL=unlisted; fi
          npx web-ext@10 sign \
            --source-dir=firefox \
            --artifacts-dir=web-ext-artifacts \
            --channel="$CHANNEL" \
            --amo-metadata=.github/amo-metadata.json \
            --approval-timeout=2700000 \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET"

      - name: Locate signed .xpi
        id: xpi
        run: |
          xpi_path=$(find web-ext-artifacts -maxdepth 1 -name '*.xpi' | head -n 1)
          if [ -z "$xpi_path" ]; then
            echo "No .xpi produced — signing likely failed or is still pending review." >&2
            exit 1
          fi
          echo "path=$xpi_path" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v6
        with:
          name: taskwarrior-connector-xpi
          path: ${{ steps.xpi.outputs.path }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.xpi.outputs.path }}
