name: Update AMO listing

# Pushes the public AMO listing (text, icon, screenshots) from the repo. web-ext sign only sends
# the "version" object of amo-metadata.json for an existing add-on, so the listing itself goes
# through the add-on edit API. Run it by hand after changing .github/amo-listing.json, the
# 128px icon or assets/screenshots/*.png: it replaces the listing, so a rerun is safe.
# AMO caps writes per hour and per day (a full run costs 2 + 2 x screenshots): after a partial
# run, rerun with screenshots_only (text and icon went through) or prune_only (new screenshots
# went through, old ones left) so nothing already applied spends the quota again.
on:
  workflow_dispatch:
    inputs:
      screenshots_only:
        description: Only replace the screenshots (listing text and icon already up to date)
        type: boolean
        default: false
      prune_only:
        description: Only delete old screenshots, keeping the newest one per PNG in the repo
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADDON: taskwarrior-connector@alkaphreak.github
      API: https://addons.mozilla.org/api/v5/addons/addon
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      SCREENSHOTS_ONLY: ${{ inputs.screenshots_only }}
      PRUNE_ONLY: ${{ inputs.prune_only }}
    steps:
      - uses: actions/checkout@v5

      - name: Push listing, icon and screenshots
        run: |
          set -euo pipefail
          # One fresh JWT per request: AMO rejects a reused jti, and exp is capped at 5 minutes.
          jwt() {
            python3 - <<'EOF'
          import base64, hashlib, hmac, json, os, time, uuid
          b = lambda d: base64.urlsafe_b64encode(json.dumps(d).encode()).rstrip(b"=")
          now = int(time.time())
          msg = b({"alg": "HS256", "typ": "JWT"}) + b"." + b({"iss": os.environ["WEB_EXT_API_KEY"], "jti": str(uuid.uuid4()), "iat": now, "exp": now + 60})
          sig = base64.urlsafe_b64encode(hmac.new(os.environ["WEB_EXT_API_SECRET"].encode(), msg, hashlib.sha256).digest()).rstrip(b"=")
          print((msg + b"." + sig).decode())
          EOF
          }
          # AMO throttles (429 "Expected available in N seconds"): a per-minute wait is retried
          # with a fresh JWT; an hourly one (over 5 min) stops the run, rerun it once it has passed.
          # Any other error prints its body to stderr: an AMO 400 names the rejected field.
          amo() {
            local out code try wait; out=$(mktemp)
            for try in 1 2 3 4 5 6; do
              code=$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: JWT $(jwt)" "$@")
              [[ $code != 429 ]] && break
              wait=$(jq -r '.detail' "$out" | grep -o '[0-9]\+ seconds' | grep -o '[0-9]\+' || echo 60)
              if (( wait > 300 )); then
                echo "AMO hourly quota reached, rerun after $((wait / 60 + 1)) min (screenshots_only if the text and icon went through)" >&2
                exit 1
              fi
              echo "AMO throttled, retry $try in $((wait + 5)) s" >&2
              sleep $((wait + 5))
            done
            [[ $code == 2* ]] || { echo "AMO HTTP $code: $(cat "$out")" >&2; exit 1; }
            cat "$out"; rm -f "$out"
          }
          URL="$API/$ADDON/"

          if [[ "$SCREENSHOTS_ONLY" != true && "$PRUNE_ONLY" != true ]]; then
            amo -X PATCH -H "Content-Type: application/json" --data @.github/amo-listing.json "$URL" > /dev/null
            amo -X PATCH -F "icon=@firefox/icons/icon-128.png" "$URL" > /dev/null
          fi

          # Replace the screenshots: upload assets/screenshots/*.png in name order first, then
          # delete the old ones, so a failed upload never leaves the listing without screenshots.
          detail=$(amo "$URL")
          if [[ "$PRUNE_ONLY" == true ]]; then
            # Preview IDs grow with each upload: keep the newest one per repo PNG.
            n=$(ls assets/screenshots/*.png | wc -l)
            old_ids=$(jq -r '.previews[].id' <<< "$detail" | sort -n | head -n "-$n")
          else
            old_ids=$(jq -r '.previews[].id' <<< "$detail")
            pos=0
            for png in assets/screenshots/*.png; do
              amo -X POST -F "image=@$png" -F "position=$pos" "${URL}previews/" > /dev/null
              pos=$((pos + 1))
            done
          fi
          for id in $old_ids; do
            amo -X DELETE "${URL}previews/$id/" > /dev/null
          done

          amo "$URL" | jq '{summary: .summary, homepage: .homepage.url, support_url: .support_url.url, categories, tags, icon_url, previews: [.previews[].image_url]}'
