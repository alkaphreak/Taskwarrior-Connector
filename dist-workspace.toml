[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Homebrew tap the formula is pushed to (repo must exist; HOMEBREW_TAP_TOKEN secret writes to it)
tap = "alkaphreak/homebrew-tap"
publish-jobs = ["homebrew"]
# bump-version.yml pushes the tag with GITHUB_TOKEN, which triggers no workflow: it dispatches this one
dispatch-releases = true
# Sign and attach the Firefox .xpi to the release dist just created
post-announce-jobs = ["./build-xpi"]
github-custom-job-permissions = { "build-xpi" = { contents = "write" } }

# GitHub's macOS arm64 runners lack capacity (v0.4.0's aarch64 job was never picked up):
# cross-compile Apple Silicon on the Intel runner, which starts in seconds.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15-intel"
