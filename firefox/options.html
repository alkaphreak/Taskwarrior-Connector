<!DOCTYPE html>
<html lang="en">
<head>
    <title>Send to Taskwarrior Hardened: preferences</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="tokens.css">
    <style>
        @font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: block; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
        @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: block; src: url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: block; src: url("fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
        @font-face { font-family: "JetBrains Mono"; font-weight: 600; font-display: block; src: url("fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2"); }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; padding: var(--space-4); background: var(--surface); color: var(--fg); font: var(--text-base)/var(--leading-body) var(--font-body); display: grid; gap: var(--space-3); max-width: 480px; }
        p { margin: 0; }
        :focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .field-label { display: block; margin-bottom: var(--space-2); font: 500 var(--text-xs)/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-2); }
        .input { width: 100%; padding: var(--space-2) var(--space-3); background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 0; font: var(--text-sm)/1.4 var(--font-mono); }
        .input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
        .input[aria-invalid="true"] { border-color: var(--danger); }
        .field-help { margin-top: var(--space-2); color: var(--muted); font-size: var(--text-xs); }
        .btn { justify-self: start; min-height: 44px; padding: 0 var(--space-4); font: 600 var(--text-xs)/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; border: 1px solid transparent; background: var(--accent); color: var(--accent-on); }
        @media (hover: hover) { .btn:hover { background: var(--accent-hover); } }
        #status { min-height: 20px; font: var(--text-xs)/1.5 var(--font-mono); color: var(--muted); }
        #status[data-state="success"] { color: var(--success); }
        #status[data-state="error"] { color: var(--danger); }
    </style>
</head>
<body>
<div>
    <label class="field-label" for="projects">projects</label>
    <textarea class="input" id="projects" rows="6" spellcheck="false" aria-describedby="projects-help"></textarea>
    <p class="field-help" id="projects-help">One per line. The first one is the popup's default. Letters, digits, . - _ (e.g. Lectures.rust).</p>
</div>
<button class="btn" id="save" type="button">Save</button>
<div id="status" role="status" aria-live="polite"></div>
<script src="projects.js"></script>
<script src="options.js"></script>
</body>
</html>
