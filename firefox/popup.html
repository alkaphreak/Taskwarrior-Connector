<!DOCTYPE html>
<html lang="en">
<head>
    <title>Send to Taskwarrior Hardened</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <!-- tokens.css is a verbatim copy of MarsTech-Skin/tokens.css: resync it from there, never edit it here -->
    <link rel="stylesheet" href="tokens.css">
    <style>
        /* MarsTech-Skin fonts, served locally (OFL licences in fonts/) */
        @font-face { font-family: "Oxanium"; font-weight: 600; font-display: block; src: url("fonts/oxanium-latin-600-normal.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: block; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
        @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: block; src: url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
        @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: block; src: url("fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
        @font-face { font-family: "JetBrains Mono"; font-weight: 600; font-display: block; src: url("fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2"); }

        /* Components from MarsTech-Skin/marstech.css, the subset this popup uses */
        :root { --mt-clip: 10px; --mt-label-tracking: 0.08em; }
        *, *::before, *::after { box-sizing: border-box; }
        p { margin: 0; }
        :focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .mt-clip { clip-path: polygon(var(--mt-clip) 0, 100% 0, 100% calc(100% - var(--mt-clip)), calc(100% - var(--mt-clip)) 100%, 0 100%, 0 var(--mt-clip)); }
        .mt-meta { font: var(--text-xs)/1.4 var(--font-mono); color: var(--meta); white-space: nowrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 var(--space-4); font: 600 var(--text-xs)/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: background-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard); }
        .btn-primary { background: var(--accent); color: var(--accent-on); }
        @media (hover: hover) { .btn-primary:hover { background: var(--accent-hover); } }
        .btn-primary:active { background: var(--accent-active); }
        .btn:disabled { background: var(--surface-warm); color: var(--meta); border-color: var(--border); cursor: not-allowed; }
        .field-label { display: block; margin-bottom: var(--space-2); font: 500 var(--text-xs)/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: var(--mt-label-tracking); color: var(--fg-2); }
        .input { width: 100%; min-height: 44px; padding: 0 var(--space-3); background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 0; font: var(--text-sm)/1.4 var(--font-mono); transition: border-color var(--motion-fast) var(--ease-standard); }
        .input::placeholder { color: var(--meta); }
        .input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
        .input[aria-invalid="true"] { border-color: var(--danger); }
        .field-help { margin-top: var(--space-2); color: var(--muted); font-size: var(--text-xs); }

        /* Popup layout, from MarsTech-Skin/prototypes/taskwarrior-popup.html */
        body { margin: 0; width: 400px; background: var(--surface); color: var(--fg); font: var(--text-base)/var(--leading-body) var(--font-body); }
        .p-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
        .p-brand { margin: 0; font: 600 var(--text-sm)/1.25 var(--font-display); letter-spacing: var(--tracking-display); text-transform: uppercase; }
        .p-brand .dot { color: var(--accent); }
        .p-body { padding: var(--space-4); display: grid; gap: var(--space-4); }
        .p-foot { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); display: grid; gap: var(--space-2); }
        .submit { width: 100%; }

        /* Status line: popup.js sets data-state, the square carries the state colour */
        #status { min-height: 20px; font: var(--text-xs)/1.5 var(--font-mono); display: flex; gap: var(--space-2); align-items: baseline; color: var(--muted); overflow-wrap: anywhere; }
        #status::before { content: ""; width: 8px; height: 8px; flex: none; background: currentColor; transform: translateY(-1px); }
        #status[data-state="success"] { color: var(--success); }
        #status[data-state="info"] { color: var(--warn); }
        #status[data-state="error"], #status[data-state="offline"] { color: var(--danger); }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
<header class="p-head">
    <h1 class="p-brand">Send to Taskwarrior<span class="dot">.</span></h1>
    <span class="mt-meta">127.0.0.1:34810</span>
</header>
<main class="p-body">
    <div>
        <label class="field-label" for="title">title <span aria-hidden="true">*</span></label>
        <!-- Unusual names keep Firefox form autocomplete out of the way -->
        <input class="input" autocomplete="off" name="hack" type="text" id="title">
    </div>
    <div>
        <label class="field-label" for="url">url <span aria-hidden="true">*</span></label>
        <input class="input" autocomplete="off" name="someUnusualName" type="text" id="url" spellcheck="false">
    </div>
    <div>
        <label class="field-label" for="tags">tags</label>
        <input class="input" autocomplete="off" name="someUnusualName" type="text" id="tags" spellcheck="false" placeholder="read-later kotlin" aria-describedby="tags-help">
        <p class="field-help" id="tags-help">Separated by spaces, without +</p>
    </div>
</main>
<footer class="p-foot">
    <button class="btn btn-primary mt-clip submit" id="submit" type="button">Add to Taskwarrior</button>
    <div id="status" role="status" aria-live="polite" data-state="idle">project:Links · POST localhost only</div>
</footer>
<script src="popup.js"></script>
</body>
</html>
